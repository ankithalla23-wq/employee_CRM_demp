version: 2

models:
  - name: br_departments
    description: "Cleaned department master data"
    columns:
      - name: department_id
        description: "Unique department business key"
        data_tests:
          - unique
          - not_null

      - name: department_name
        description: "Standardized department name"
        data_tests:
          - not_null

      - name: location
        description: "Department operating location"
        data_tests:
          - not_null

      - name: manager_employee_id
        description: "Department manager employee ID"
        data_tests:
          - not_null

      - name: updated_at
        description: "Last source modification timestamp"
        data_tests:
          - not_null