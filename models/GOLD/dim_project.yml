version: 2

models:
  - name: dim_project
    description: "Current-state CRM project dimension"
    columns:
      - name: project_key
        description: "Project surrogate key"
        data_tests:
          - unique
          - not_null

      - name: project_id
        description: "Project business key"
        data_tests:
          - unique
          - not_null

      - name: project_name
        description: "Project display name"

      - name: client_name
        description: "Client name"

      - name: start_date
        description: "Project start date"

      - name: end_date
        description: "Project end date"

      - name: budget
        description: "Approved project budget"

      - name: project_status
        description: "Current project status"

      - name: project_duration_days
        description: "Planned project calendar duration"

      - name: updated_at
        description: "Source update timestamp"

      - name: row_hash
        description: "Project dimension change hash"
        data_tests:
          - not_null