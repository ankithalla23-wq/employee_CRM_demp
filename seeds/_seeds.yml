version: 2

seeds:
  - name: employees
    config:
      column_types:
        employee_id: number(38,0)
        department_id: varchar(10)
        job_id: varchar(10)

  - name: departments
    config:
      column_types:
        department_id: varchar(10)
        manager_employee_id: number(38,0)

  - name: jobs
    config:
      column_types:
        job_id: varchar(10)
        min_salary: number(18,2)
        max_salary: number(18,2)

  - name: salaries
    config:
      column_types:
        salary_id: varchar(10)
        employee_id: number(38,0)

  - name: attendance
    config:
      column_types:
        attendance_id: varchar(10)
        employee_id: number(38,0)
        check_in: varchar(5)
        check_out: varchar(5)

  - name: leaves
    config:
      column_types:
        leave_id: varchar(10)
        employee_id: number(38,0)

  - name: performance
    config:
      column_types:
        review_id: varchar(10)
        employee_id: number(38,0)
        reviewer_employee_id: number(38,0)

  - name: projects
    config:
      column_types:
        project_id: varchar(10)
        budget: number(18,2)

  - name: assignments
    config:
      column_types:
        assignment_id: varchar(10)
        employee_id: number(38,0)
        project_id: varchar(10)

  - name: training
    config:
      column_types:
        training_id: varchar(10)
        employee_id: number(38,0)